<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px;
    height: 1080px;
    background-color: #0f0808;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 60px;
  }
  .text {
    color: #F5F0DC;
    font-family: Arial Black, Arial, sans-serif;
    font-size: 96px;
    font-weight: 900;
    text-align: center;
    letter-spacing: 2px;
    line-height: 1.2;
  }
  .forward {
    color: #FF6B47;
  }
</style>
</head>
<body>
  <div class="text">DO NOTHING — CHINA WINS.</div>
  <div class="text"><span class="forward">FORWARD</span> THIS — AMERICA LIVES.</div>
</body>
</html>
